    "examples/config_LMDBDelta.json",
    "examples/config_Find_WebSocketUi.json",
    "src/test/resources/testOpenCLInfo/config_OpenCLInfo.json",
    "src/test/resources/testRoundtrip/config_AddressFilesToLMDB.json",
    "src/test/resources/testRoundtrip/config_Find_1OpenCLDevice.json",
    "src/test/resources/testRoundtrip/config_Find_SecretsFile.json",
    "src/test/resources/testRoundtrip/config_LMDBToAddressFile.json",
    "src/test/resources/vectors.json",
    # Text/data files (no comment syntax)
    "examples/addresses/fileContainingAddresses0.txt",
    "examples/addresses/fileContainingAddresses1.tsv",
    "examples/addresses/fileContainingAddresses2.csv",
    "examples/secrets/fileContainingSecrets_BIG_INTEGER.txt",
    "examples/secrets/fileContainingSecrets_DUMPED_PRIVATE_KEY.txt",
    "examples/secrets/fileContainingSecrets_SHA256.txt",
    "examples/secrets/fileContainingSecrets_STRING_DO_SHA256.txt",
    "src/test/resources/testRoundtrip/addresses/fileContainingAddresses0.txt",
    "src/test/resources/testRoundtrip/addresses/fileContainingAddresses1.tsv",
    "src/test/resources/testRoundtrip/addresses/fileContainingAddresses2.csv",
    "src/test/resources/testRoundtrip/secrets/fileContainingSecrets_BIG_INTEGER.txt",
    "src/test/resources/testRoundtrip/secrets/fileContainingSecrets_DUMPED_PRIVATE_KEY.txt",
    "src/test/resources/testRoundtrip/secrets/fileContainingSecrets_SHA256.txt",
    "src/test/resources/testRoundtrip/secrets/fileContainingSecrets_STRING_DO_SHA256.txt",
