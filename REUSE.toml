    "src/main/resources/mnemonic/wordlist/chinese_simplified.txt",
    "src/main/resources/mnemonic/wordlist/chinese_traditional.txt",
    "src/main/resources/mnemonic/wordlist/czech.txt",
    "src/main/resources/mnemonic/wordlist/english.txt",
    "src/main/resources/mnemonic/wordlist/french.txt",
    "src/main/resources/mnemonic/wordlist/italian.txt",
    "src/main/resources/mnemonic/wordlist/japanese.txt",
    "src/main/resources/mnemonic/wordlist/korean.txt",
    "src/main/resources/mnemonic/wordlist/portuguese.txt",
    "src/main/resources/mnemonic/wordlist/russian.txt",
    "src/main/resources/mnemonic/wordlist/spanish.txt",
    "src/main/resources/mnemonic/wordlist/turkish.txt",
    # YAML/YAML-like config files not recognized for inline headers
    "src/test/resources/testOpenCLInfo/config_OpenCLInfo.yaml",
    "src/test/resources/testOpenCLInfo/config_OpenCLInfo.yml",
    # JS test resource (no inline SPDX appropriate)
    "src/test/resources/testOpenCLInfo/config_OpenCLInfo.js",
    # Measurement data and generated plots. CSV has no comment syntax, JSON none either, and PNG
    # is binary — a glob keeps new machines and new benchmark runs compliant without an edit here
    # every time, which is what let these drift out of coverage in the first place.
    "docs/measurements/**.csv",
    "docs/measurements/**.json",
    "docs/measurements/plots/**.png",
    # JVM config (plain flags file, no comment syntax)
    ".mvn/jvm.config",
    # simplelogger.properties uses Java properties syntax (# comments supported but tool may not recognize)
    "src/main/resources/simplelogger.properties",
]
SPDX-FileCopyrightText = "2017-2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# ---------------------------------------------------------------------------
# Third-party: hashcat project files (MIT)
# Ten of the twelve files are byte-identical to hashcat commit
# 2d71af3718ef76f69c675e933cb4900c40788c58; inc_ecc_secp256k1.cl and inc_vendor.h are modified here
# (inc_ecc_secp256k1.cl also carries ports of libsecp256k1, MIT, and a micro-ecc notice, BSD-2-Clause).
# Source: https://github.com/hashcat/hashcat
# Files carry "License.....: MIT" in their own header comments; the hashcat license text and
# docs/credits.txt they point to are in third-party-notices/hashcat-2d71af37/.
# ---------------------------------------------------------------------------

[[annotations]]
path = [
    "src/main/resources/copyfromhashcat/inc_common.cl",
    "src/main/resources/copyfromhashcat/inc_common.h",
    "src/main/resources/copyfromhashcat/inc_ecc_secp256k1.cl",
    "src/main/resources/copyfromhashcat/inc_ecc_secp256k1.h",
    "src/main/resources/copyfromhashcat/inc_hash_ripemd160.cl",
    "src/main/resources/copyfromhashcat/inc_hash_ripemd160.h",
    "src/main/resources/copyfromhashcat/inc_hash_sha256.cl",
    "src/main/resources/copyfromhashcat/inc_hash_sha256.h",
    "src/main/resources/copyfromhashcat/inc_platform.cl",
    "src/main/resources/copyfromhashcat/inc_platform.h",
    "src/main/resources/copyfromhashcat/inc_types.h",
    "src/main/resources/copyfromhashcat/inc_vendor.h",
]
SPDX-FileCopyrightText = "2015-2025 Jens Steube"
SPDX-License-Identifier = "MIT"

# The modified secp256k1 kernel also carries big-number code in the manner of micro-ecc (2-Clause
# BSD, its terms quoted in the file) and the safegcd inverse ported from libsecp256k1 (MIT).
[[annotations]]
path = "src/main/resources/copyfromhashcat/inc_ecc_secp256k1.cl"
SPDX-FileCopyrightText = ["2015-2025 Jens Steube", "2014 Ken MacKay", "2020 Peter Dettman", "2017-2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"]
SPDX-License-Identifier = "MIT AND BSD-2-Clause"

