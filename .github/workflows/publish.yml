name: Publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_to_central:
        description: "Deploy to Maven Central (snapshot if -SNAPSHOT, release if a vX.Y.Z tag)"
        type: boolean
        default: false

# Supersede an in-flight run when a PR branch is pushed again.
#
# Without this every push starts a full parallel pipeline and the older ones keep
# draining -- four were live at once during one session, which makes "what is CI
# saying right now" genuinely ambiguous and wastes a lot of runner time on results
# nobody will read.
#
# cancel-in-progress is deliberately scoped to pull_request ONLY. A push to main or
# to a v* tag is a release path: cancelling one midway could leave a partially
# published set of artifacts.
#
# cancel-in-progress: false is NOT sufficient on its own to protect a release run.
# GitHub cancels a *pending* run whenever a newer run joins the same group behind an
# in-progress one -- that rule is independent of cancel-in-progress. So with a plain
# `workflow-ref` group, a queued `publish_to_central` dispatch on main could be
# silently dropped by a later push to main, both sharing `Publish-refs/heads/main`.
# Giving every non-PR run its own group (via the unique run_id) means such a run is
# never queued behind a sibling and therefore can never be cancelled, while PR runs
# still share a group per ref and supersede each other as intended.
#
# One-time effect when this expression changes: GitHub reads `concurrency` from the
# workflow file at each run's own ref, so a run started before the change sits in the
# old group and a run started after it sits in the new one. They are different groups,
# so the new push does NOT supersede the in-flight old run -- exactly once, on the
# commit that lands this. It self-heals from the next push on. Expect the same overlap
# when porting this to a sibling repo; it is not a sign the expression is wrong.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Start gate — single cancellable abort window before the pipeline starts.
  # The wait duration lives in the `startgate` GitHub Environment (Settings →
  # Environments → startgate → Wait timer).
  # ---------------------------------------------------------------------------
  startgate:
    name: Start gate (abort window)
    runs-on: ubuntu-latest
    environment: startgate
    steps:
      - run: echo "Start gate elapsed — proceeding with pipeline."

  # ---------------------------------------------------------------------------
  # The repository checks of bernardladenthin/actions, configured in
  # .github/actions-config.json: the files this repository keeps equal to the templates
  # there (replaced the shared-files.sha256 manifest), the release gate, bash -n over
  # every run script, Maven version drift against the sibling repositories (warnings
  # only), and the publication wiring plus a dry run of the release asset contract.
  # ---------------------------------------------------------------------------
  repository-checks:
    name: Repository checks
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Files equal their templates in bernardladenthin/actions
        uses: bernardladenthin/actions/common/check-templates@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - name: Release gate (every job gates both publish jobs, or release-gate-exemptions.txt says why)
        uses: bernardladenthin/actions/common/check-release-gate@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - name: Run scripts parse (bash -n over every bash run script of the workflows and actions)
        uses: bernardladenthin/actions/common/check-run-scripts@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - name: Maven versions (warns where a dependency or plugin differs from a sibling repository)
        uses: bernardladenthin/actions/java/check-maven-versions@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - name: Publication wiring and release asset contract (dry run)
        uses: bernardladenthin/actions/java/check-publication@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3

  # ---------------------------------------------------------------------------
  # GPG signing-key preflight (standalone, no `needs:` -- runs in parallel at the
  # very start on every trigger): what maven-gpg-plugin does at deploy time, so a
  # bad/expired key or wrong passphrase is caught in ~20s instead of failing the
  # publish stage. `environment: maven-central` gives it the SAME secret the publish
  # jobs use. EXPECTED to go RED where the secret is not delivered (fork PRs, other
  # contributors' branches): "this ref cannot sign a release", not a regression.
  # Prints only public key metadata; the security notes are in the action's script.
  # ---------------------------------------------------------------------------
  verify-signing-key:
    name: Verify GPG signing key (no secrets printed)
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: bernardladenthin/actions/common/verify-gpg-key@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

  # ---------------------------------------------------------------------------
  # The same key through Gradle's signing plugin + useInMemoryPgpKeys (BouncyCastle),
  # the path a Gradle publication (an Android AAR) signs with. BouncyCastle parses the
  # armored key more strictly than gpg, so it catches what the job above tolerates.
  # It signs the action's own throwaway project, so it is the same in every repository
  # ("prepared for Gradle"). Red by design where the secret is not delivered.
  # ---------------------------------------------------------------------------
  verify-signing-key-gradle:
    name: Verify GPG signing key — Gradle/BouncyCastle path (no secrets printed)
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bernardladenthin/actions/java/verify-signing-key-gradle@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          key-id: ${{ secrets.GPG_KEY_ID }}

  code-style:
    name: Code style (spotless) + package graph
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bernardladenthin/actions/java/maven-code-style@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          package-pattern: 'net\.ladenthin\.'

  build:
    name: Build
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - uses: bernardladenthin/actions/common/setup@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - name: Build
        # -Dmaven.javadoc.skip=true is REQUIRED here and is the ONLY surviving javadoc
        # skip across all four sibling repos (do not remove without the full-build check
        # below). This job runs plain `mvn package`, which triggers attach-javadocs at
        # prepare-package. BAF's javadoc is module-aware (<source>21</source> +
        # module-info.java in src/main/java9), so an unguarded run can flip into JPMS
        # module mode and fail ("No source files for package net.ladenthin..."). Javadoc
        # is validated deliberately via `-P release` in the publish jobs. The Java-8
        # sibling repos (java-llama.cpp / streambuffer / llamacpp-ai-index, <source>8>)
        # are immune (classpath mode regardless) and carry no such flag. To drop this,
        # first prove `mvn package` builds javadoc clean (a standalone `mvn javadoc:jar`
        # cannot — it always runs classpath mode and hides the trap). See CLAUDE.md
        # "Verifying Javadoc locally" and workspace/crossrepostatus.md.
        #
        # -P assembly additionally builds the runnable fat jar-with-dependencies
        # (bitcoinaddressfinder-<version>-jar-with-dependencies.jar). It lands in target/ and
        # rides along in the `jars` upload-artifact below as a CI run artifact. It is NOT a Maven
        # Central asset (never deployed there). It IS attached to the GitHub Release, but that copy
        # is produced+signed independently by the publish-release / publish-snapshot jobs (their
        # "Build & sign fat jar" step), not taken from this build job's upload-artifact.
        # The assembly profile runs the license collector of bernardladenthin/actions (ACTIONS_DIR,
        # exported by the setup step above).
        run: mvn --batch-mode --no-transfer-progress -P assembly -Dnet.ladenthin.bitcoinaddressfinder.disableLMDBTest=true -DskipTests -Dmaven.javadoc.skip=true package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: jars, path: target/*.jar }
      # Echo the crash logs into the job log (workspace/policies/ci-test-diagnostics.md 3.1).
      - name: Print crash logs (on failure)
        if: failure()
        uses: bernardladenthin/actions/java/print-crash-logs@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          modules: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: build-surefire
          path: |
            target/surefire-reports/**
            hs_err_pid*.log
          if-no-files-found: ignore

  test:
    name: Test (${{ matrix.os }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            disable-lmdb: true
          - os: windows-latest
            disable-lmdb: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Memory before tests
        if: runner.os == 'Linux'
        run: free -h
      - name: Test
        shell: bash
        run: mvn -e --batch-mode --no-transfer-progress -P jcstress -Dnet.ladenthin.bitcoinaddressfinder.disableLMDBTest=${{ matrix.disable-lmdb }} --update-snapshots test jacoco:report
      # Echo the crash logs into the job log (workspace/policies/ci-test-diagnostics.md 3.1).
      - name: Print crash logs (on failure)
        if: failure()
        uses: bernardladenthin/actions/java/print-crash-logs@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          modules: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: surefire-and-crash-logs-${{ matrix.os }}
          path: |
            target/surefire-reports/**
            hs_err_pid*.log
            *.hprof
      - name: Memory after tests
        if: always() && runner.os == 'Linux'
        run: free -h
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
      - name: Run PIT mutation tests
        if: matrix.os == 'ubuntu-latest'
        run: mvn --batch-mode --no-transfer-progress -Dnet.ladenthin.bitcoinaddressfinder.disableLMDBTest=true test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Extract PIT survivors
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          echo "=== PIT Survived Mutations ==="
          for html_file in $(find target/pit-reports -name "*.html" -type f 2>/dev/null | sort); do
            if grep -q "SURVIVED" "$html_file"; then
              echo "Found survivors in $html_file:"
              grep -B 2 -A 3 "SURVIVED" "$html_file"
              echo ""
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && matrix.os == 'ubuntu-latest'
        with: { name: pit-reports, path: target/pit-reports/ }

  # ---------------------------------------------------------------------------
  # vmlens interleaving analysis — pure-Java, needs no LMDB or OpenCL device.
  # Staged to a single smoke test for now (see the `vmlens` profile in pom.xml).
  # ---------------------------------------------------------------------------
  vmlens:
    name: Test (vmlens interleavings)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Test under vmlens (interleaving analysis)
        # Add each new test in the `vmlens` package to this -Dtest list (surefire
        # -Dtest matches simple class names, not package globs; the default suite is
        # excluded from the vmlens package via pom.xml managed surefire <excludes>).
        run: >-
          mvn --batch-mode --no-transfer-progress -Pvmlens test
          -Dtest=VmlensInterleavingSmokeTest,KeyProducerQueueBufferedInterleavingTest
          -DfailIfNoTests=false
          -Dnet.ladenthin.bitcoinaddressfinder.disableLMDBTest=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vmlens-report
          path: target/vmlens-report/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Emulated-OpenCL coverage on a real CPU OpenCL device (pocl), kept separate
  # from the `test` matrix above. This is a REQUIRED gate — both Ubuntu pipelines
  # (the CPU-only `test` matrix where @OpenCLTest self-skips, and this emulated
  # OpenCL run) must stay green.
  #
  # Why a separate job rather than adding pocl to the `test` matrix:
  #   * The main matrix stays exactly as before — no OpenCL ICD installed there,
  #     so the @OpenCLTest suite self-skips via OpenCLPlatformAssume and those
  #     jobs remain green. The existing config is untouched.
  #   * pocl is a conformant OpenCL 3.0 CPU implementation; its device clears
  #     BAF's `CL_DEVICE_VERSION >= 2.0` gate, so here the @OpenCLTest suite
  #     actually executes (real kernel compile + run on a CPU device).
  #
  # Coverage note:
  #   This job runs the FULL test suite (not just @OpenCLTest) and generates the
  #   JaCoCo report that is sent to Coveralls / Codecov. The `test` ubuntu matrix
  #   above also generates a jacoco-report artifact but that one skips all
  #   @OpenCLTest classes (no ICD installed), so it would show 0% for the entire
  #   OpenCL pipeline. Using the pocl run as the coverage source gives meaningful
  #   numbers for OpenCLContext, OpenClTask, OpenCLGridResult, ProducerOpenCL, etc.
  #   LMDB tests are still disabled here (native lib unavailable on GitHub runners);
  #   Windows coverage (LMDB-enabled) is not merged — acceptable trade-off.
  #
  # Reliability notes (why this is now safe to gate on):
  #   * The secp256k1 kernel's zero-scalar out-of-bounds read in `point_mul_xy`
  #     (which a CPU device traps as SIGSEGV while GPUs mask it) is fixed by an
  #     in-kernel guard.
  #   * ProbeAddressesOpenCLTest's grid-size sweep is device-aware: on a CPU-only
  #     device it caps the grid via OpenCLPlatformAssume (default 2^4) so the run
  #     stays within the per-fork test timeout; a GPU still runs the full sweep.
  #     Override with
  #     -Dnet.ladenthin.bitcoinaddressfinder.test.opencl.cpu.maxGridBits=N.
  # The hs_err / dumpstream are echoed on failure for diagnosis.
  # ---------------------------------------------------------------------------
  test-opencl:
    name: Test OpenCL (pocl CPU)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Install pocl (CPU OpenCL 3.0 ICD)
        run: |
          sudo apt-get update
          sudo apt-get install -y pocl-opencl-icd ocl-icd-libopencl1 clinfo
          # Log the platform/device + CL_DEVICE_VERSION for the build record.
          clinfo || true
      # Capture the runner's memory + process/thread limits BEFORE the test run. A
      # "Error occurred in starting fork" failure with no hs_err and no surefire dumpstream
      # is an OS-level spawn failure (ENOMEM / EAGAIN), not a test timeout — these numbers
      # plus `mvn -e` (which prints the underlying IOException errno) make it diagnosable.
      - name: Runner resource snapshot (pre-test)
        shell: bash
        run: |
          echo "===== free -m ====="; free -m || true
          echo "===== nproc ====="; nproc || true
          echo "===== ulimit -a ====="; ulimit -a || true
          echo "===== vm.max_map_count ====="; cat /proc/sys/vm/max_map_count || true
          echo "===== vm.overcommit_memory ====="; cat /proc/sys/vm/overcommit_memory || true
      # pocl compiles kernels with an in-process LLVM that replaces the JVM's SIGSEGV handler;
      # concurrent safepoints in a forked test JVM can then kill it without an hs_err file.
      # Preloading the JDK's signal chaining keeps the JVM's handlers in front (inherited by
      # the Surefire forks). See SignalChainingCheck and README "OpenCL on Linux: signal chaining".
      # POCL_MAX_WORK_GROUP_SIZE: without a local work size pocl picks its maximum group (4096 on a
      # 16-core host) and the secp256k1 kernel runs off the end of the worker thread's 8 MB stack --
      # MainTest#testRoundtripOpenCLProducer_* died 5 of 5 times without the limit and never with
      # 256 (BUGHUNT-MEASUREMENTS.md B2, results at feb6157). The finder now passes a local size of
      # at most 256 for every kernel it launches on a pocl CPU device itself (OpenClLocalWorkSize,
      # OpenClKernelLauncher; F211, F216), so the production code does not need the variable; it stays
      # for the kernels test classes launch directly through ClApi without a local size.
      - name: All tests including OpenCL (pocl) + JaCoCo coverage
        shell: bash
        run: |
          test -f "$JAVA_HOME/lib/libjsig.so"
          export LD_PRELOAD="$JAVA_HOME/lib/libjsig.so"
          export POCL_MAX_WORK_GROUP_SIZE=256
          mvn -e --batch-mode --no-transfer-progress -Dnet.ladenthin.bitcoinaddressfinder.disableLMDBTest=true --update-snapshots test jacoco:report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-report-opencl
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: warn
      # A forked test JVM that aborts natively (e.g. the pocl out-of-bounds read in
      # the secp256k1 kernel, fixed in bc9d922) leaves an hs_err_pid log + a surefire
      # dumpstream that are otherwise only inside the uploaded artifact. Echo them into the job log
      # on failure so the native frame is readable directly.
      - name: Dump memory and thread state (on failure)
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "===== free -m (post-failure) ====="; free -m || true
          echo "===== thread/process count (post-failure) ====="; ps -eL 2>/dev/null | wc -l || true
      # hs_err + surefire dumps: the shared step of every other test job.
      - name: Dump native crash logs (on failure)
        if: ${{ failure() }}
        uses: bernardladenthin/actions/java/print-crash-logs@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - name: Dump OpenCL surefire reports (on failure)
        if: ${{ failure() }}
        shell: bash
        run: |
          shopt -s nullglob
          echo "===== OpenCL surefire reports ====="
          for f in target/surefire-reports/*OpenCL*.txt; do [ -e "$f" ] && { echo "----- $f -----"; cat "$f"; }; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: surefire-and-crash-logs-opencl
          path: |
            target/surefire-reports/**
            hs_err_pid*.log
            *.hprof
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Fat-jar smoke test — cross-repo standard job, kept in the same shape in srcmorph and
  # java-llama.cpp (see workspace/policies/fat-jar-release-assets.md, "No release asset is
  # attached that CI has not run"). The fat jar is a GitHub-Release asset, and unit tests never
  # touch it: they run off target/classes, so an unrunnable uber jar — no Main-Class, a
  # shade-mangled resource, a missing SLF4J binding — is built and GPG-signed without anything
  # noticing. Signing proves who built it, not that it works.
  #
  # BAF-specific: config_AddressFilesToLMDB.json imports the bundled sample address files into a
  # fresh LMDB under examples/, so this also exercises the lmdbjava NATIVE library out of the fat
  # jar — the closest analogue to what jllama's smoke checks — with no network and no GPU. It is
  # deliberately a plain `java -jar`: examples/run_AddressFilesToLMDB.sh passes a long
  # --add-opens/--add-exports list for lmdbjava's internal-JDK reflection, but the import runs
  # clean without it, and the contract under test is that the published artifact runs as-is. It
  # runs twice: on the build JDK of .java-version, and on Java 21, the floor the jar is compiled
  # for (release 21) and the only run of anything on that floor, since every other job builds and
  # tests on .java-version. Keep this job on the OpenCL-free runner: it must not depend on an ICD
  # being installed.
  # ---------------------------------------------------------------------------

  smoke-fatjar:
    name: Smoke test fat jar
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jars
          path: fatjar/
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
      # Cross-repo shared gate (workspace/crossrepostatus.md checksum table). maven.compiler.release
      # governs only the code we compile; a dependency built for a newer Java lands in the jar
      # untouched and surfaces as UnsupportedClassVersionError on a consumer's JVM. Scans the whole
      # artifact, so the library jar and the jar-with-dependencies are both covered.
      #
      # 65 = Java 21, this project's target -- deliberately NOT the 52 the Java 8 siblings use.
      # That is why the ceiling is an argument: it belongs next to the release it describes.
      - name: Verify Java 21 bytecode (no class newer than major 65)
        uses: bernardladenthin/actions/java/verify-bytecode@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          max-major: "65"
          paths: |
            fatjar
      - name: Run fat-jar smoke test
        uses: bernardladenthin/actions/java/smoke-fatjar-cli@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          jar-dir: fatjar
          jar-glob: 'bitcoinaddressfinder-*-jar-with-dependencies.jar'
          work-dir: examples
          marker: 'Main#run end\.'
          args: config_AddressFilesToLMDB.json
      - name: Install Java 21, the floor of the published jar
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: temurin
      - name: Start the Java 21 run from a fresh database, as the first run did
        run: |
          java -version
          rm -rf examples/lmdb
      - name: Run the same fat jar on Java 21
        uses: bernardladenthin/actions/java/smoke-fatjar-cli@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          jar-dir: fatjar
          jar-glob: 'bitcoinaddressfinder-*-jar-with-dependencies.jar'
          work-dir: examples
          marker: 'Main#run end\.'
          args: config_AddressFilesToLMDB.json
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-fatjar-logs
          path: |
            smoke-out.log
            smoke-err.log
          if-no-files-found: warn

  report:
    name: Report
    needs: [test, test-opencl]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Prefer coverage from the pocl job: it runs ALL tests including @OpenCLTest
      # (the ubuntu `test` matrix skips those because no ICD is installed there,
      # so its jacoco-report shows 0% for the entire OpenCL pipeline).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: jacoco-report-opencl, path: target/site/jacoco/ }
        continue-on-error: true
      # The dependency graph is submitted by dependency-submission.yml (on pushes to main, with the
      # JDK of .java-version), not here: this job gates the release path and needs no write access.
      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: target/site/jacoco/jacoco.xml
          format: jacoco
        continue-on-error: true
      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
        continue-on-error: true

  check-snapshot:
    name: "Check: main branch / SNAPSHOT"
    needs: [report]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Every project version ends in -SNAPSHOT before anything is published to the snapshot channel.
      # Only then: a push publishes nothing, and main carries the release version for the commit
      # a release is tagged on.
      - name: Require a SNAPSHOT version
        if: inputs.publish_to_central
        uses: bernardladenthin/actions/java/check-release-ref@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: snapshot

  check-tag:
    name: "Check: v* tag"
    needs: [report]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The tag names exactly the project version (v1.2.3 for 1.2.3), which is no SNAPSHOT.
      - name: Require the release version the tag names
        uses: bernardladenthin/actions/java/check-release-ref@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: release

  publish-snapshot:
    name: Prepare and verify signed snapshot artifacts
    needs:
      - check-snapshot
      - code-style
      - smoke-fatjar
      - repository-checks
      - vmlens
    if: needs.check-snapshot.result == 'success' && inputs.publish_to_central
    runs-on: ubuntu-latest
    environment: maven-central
    outputs:
      assets_complete: ${{ steps.finalize.outputs.complete }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Guard - require a -SNAPSHOT version
        shell: bash
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n1)
          echo "Resolved project version: $VERSION"
          case "$VERSION" in
            *-SNAPSHOT) echo "OK: -SNAPSHOT version, continuing local snapshot staging." ;;
            *) echo "::error::Refusing to publish non-SNAPSHOT version '$VERSION' from the snapshot job. Snapshot publishing requires a -SNAPSHOT version; releases go through the v* tag path."; exit 1 ;;
          esac
      - name: Show effective POM (debug)
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true help:effective-pom
      - name: Stage snapshot
        run: mvn --batch-mode --no-transfer-progress -Dnet.ladenthin.bitcoinaddressfinder.disableLMDBTest=true -P release -DskipUpload=true deploy
          -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # actionlib on PYTHONPATH and ACTIONS_DIR for the steps below: the preservation and the license
      # collector the assembly profile runs.
      - uses: bernardladenthin/actions/common/setup@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - name: Preserve signed Central outputs before the fat jar rebuild
        run: python3 -m actionlib.java.releaseassets central-assets --maven-only
      - name: "Build & sign fat jar (GitHub asset only \u2014 not deployed to Central)"
        run: mvn --batch-mode --no-transfer-progress -Dnet.ladenthin.bitcoinaddressfinder.disableLMDBTest=true -Dmaven.javadoc.skip=true -P release,assembly verify -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Finalize and secure the signed publication
        id: finalize
        uses: bernardladenthin/actions/java/finalize-publication@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: snapshot
          maven-assets: central-assets

  github-snapshot:
    name: Update Snapshot Pre-release on GitHub
    needs:
      - publish-snapshot
    if: ${{ !cancelled() && needs.publish-snapshot.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: snapshot-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: bernardladenthin/actions/java/publish-github@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: snapshot
          assets-complete: ${{ needs.publish-snapshot.outputs.assets_complete }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Prepare and verify signed release artifacts
    needs:
      - check-tag
      - code-style
      - smoke-fatjar
      - repository-checks
      - vmlens
    if: needs.check-tag.result == 'success' && inputs.publish_to_central
    runs-on: ubuntu-latest
    environment: maven-central
    outputs:
      assets_complete: ${{ steps.finalize.outputs.complete }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Show effective POM (debug)
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true help:effective-pom
      - name: Stage release
        run: mvn --batch-mode --no-transfer-progress -Dnet.ladenthin.bitcoinaddressfinder.disableLMDBTest=true -P release -DskipUpload=true deploy
          -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # actionlib on PYTHONPATH and ACTIONS_DIR for the steps below: the preservation and the license
      # collector the assembly profile runs.
      - uses: bernardladenthin/actions/common/setup@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
      - name: Preserve signed Central outputs before the fat jar rebuild
        run: python3 -m actionlib.java.releaseassets central-assets --maven-only
      - name: "Build & sign fat jar (GitHub asset only \u2014 not deployed to Central)"
        run: mvn --batch-mode --no-transfer-progress -Dnet.ladenthin.bitcoinaddressfinder.disableLMDBTest=true -Dmaven.javadoc.skip=true -P release,assembly verify -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Finalize and secure the signed publication
        id: finalize
        uses: bernardladenthin/actions/java/finalize-publication@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: release
          maven-assets: central-assets

  github-release:
    name: Attach Binaries to GitHub Release
    needs:
      - publish-release
    if: ${{ !cancelled() && needs.publish-release.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: bernardladenthin/actions/java/publish-github@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: release
          assets-complete: ${{ needs.publish-release.outputs.assets_complete }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  central-snapshot:
    name: Upload checked snapshot artifacts to Maven Central
    needs:
      - publish-snapshot
    if: ${{ !cancelled() && needs.publish-snapshot.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    environment: maven-central
    # One transfer at a time; an older commit finishing late is skipped (the superseded check).
    concurrency:
      group: central-snapshot-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Transfer frozen artifacts (no rebuild, signing or validation polling)
        uses: bernardladenthin/actions/java/publish-central@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: snapshot
          assets-complete: ${{ needs.publish-snapshot.outputs.assets_complete }}
          username: ${{ secrets.CENTRAL_USERNAME }}
          password: ${{ secrets.CENTRAL_TOKEN }}

  central-release:
    name: Upload checked release artifacts to Maven Central
    needs:
      - publish-release
    if: ${{ !cancelled() && needs.publish-release.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Transfer frozen artifacts (no rebuild, signing or validation polling)
        uses: bernardladenthin/actions/java/publish-central@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: release
          assets-complete: ${{ needs.publish-release.outputs.assets_complete }}
          username: ${{ secrets.CENTRAL_USERNAME }}
          password: ${{ secrets.CENTRAL_TOKEN }}

  attest-snapshot:
    name: Attest the checked snapshot publication
    needs:
      - publish-snapshot
    if: ${{ !cancelled() && needs.publish-snapshot.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: bernardladenthin/actions/java/attest-publication@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: snapshot
          assets-complete: ${{ needs.publish-snapshot.outputs.assets_complete }}

  attest-release:
    name: Attest the checked release publication
    needs:
      - publish-release
    if: ${{ !cancelled() && needs.publish-release.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: bernardladenthin/actions/java/attest-publication@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
        with:
          channel: release
          assets-complete: ${{ needs.publish-release.outputs.assets_complete }}
