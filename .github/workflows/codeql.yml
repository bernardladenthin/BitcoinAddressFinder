# Template of bernardladenthin/actions (templates/java); the job is its reusable workflow.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "12 1 * * 0"

permissions:
  contents: read

jobs:
  analyze:
    uses: bernardladenthin/actions/.github/workflows/java-codeql.yml@df774809fbe99a5adc7b1243d053692cd840fe05 # v1.0.1
    permissions:
      actions: read
      contents: read
      security-events: write
