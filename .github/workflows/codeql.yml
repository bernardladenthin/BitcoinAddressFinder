# Template of bernardladenthin/actions (templates/java); the job is its reusable workflow.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "12 1 * * 0"

permissions:
  contents: read

jobs:
  analyze:
    uses: bernardladenthin/actions/.github/workflows/java-codeql.yml@f62f8f48b84f4789ef57af563d364b2c0b658ab0 # v1.2.1
    permissions:
      actions: read
      contents: read
      security-events: write
