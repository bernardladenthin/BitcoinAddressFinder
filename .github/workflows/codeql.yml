# Template of bernardladenthin/actions (templates/java); the job is its reusable workflow.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "12 1 * * 0"

permissions:
  contents: read

jobs:
  analyze:
    uses: bernardladenthin/actions/.github/workflows/java-codeql.yml@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
    permissions:
      actions: read
      contents: read
      security-events: write
