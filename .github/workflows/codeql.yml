# Template of bernardladenthin/actions (templates/java); the job is its reusable workflow.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "12 1 * * 0"

permissions:
  contents: read

jobs:
  analyze:
    uses: bernardladenthin/actions/.github/workflows/java-codeql.yml@a9386a26fe6706204cb4d975e6958d29bc783624 # v1.1.1
    permissions:
      actions: read
      contents: read
      security-events: write
