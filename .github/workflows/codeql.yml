# Template of bernardladenthin/actions (templates/java); the job is its reusable workflow.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "12 1 * * 0"

permissions:
  contents: read

jobs:
  analyze:
    uses: bernardladenthin/actions/.github/workflows/java-codeql.yml@e7554f8d2e3f2e59dac55c5f6a7cb5be7b6d8606 # v1.2.3
    permissions:
      actions: read
      contents: read
      security-events: write
