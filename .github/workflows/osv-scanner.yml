# Template of bernardladenthin/actions (templates/common); the jobs are its reusable workflow.
name: OSV-Scanner

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: bernardladenthin/actions/.github/workflows/osv-scanner.yml@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
    permissions:
      actions: read
      contents: read
      security-events: write
