# Template of bernardladenthin/actions (templates/common); the jobs are its reusable workflow.
name: OSV-Scanner

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: bernardladenthin/actions/.github/workflows/osv-scanner.yml@7646ab0603d75ee130463eceaa8988f7352e2d6a # v1.0.0
    permissions:
      actions: read
      contents: read
      security-events: write
