# Template of bernardladenthin/actions (templates/common); the jobs are its reusable workflow.
name: OSV-Scanner

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: bernardladenthin/actions/.github/workflows/osv-scanner.yml@e7554f8d2e3f2e59dac55c5f6a7cb5be7b6d8606 # v1.2.3
    permissions:
      actions: read
      contents: read
      security-events: write
