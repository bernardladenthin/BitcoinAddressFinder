# Template of bernardladenthin/actions (templates/common); the jobs are its reusable workflow.
name: OSV-Scanner

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: bernardladenthin/actions/.github/workflows/osv-scanner.yml@f62f8f48b84f4789ef57af563d364b2c0b658ab0 # v1.2.1
    permissions:
      actions: read
      contents: read
      security-events: write
