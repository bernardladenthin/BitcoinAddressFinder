# Template of bernardladenthin/actions (templates/java); the job is its reusable workflow.
name: Maven Dependency Submission

on:
  # The graph GitHub shows is the default branch's. Other branches (Dependabot's among them, whose
  # pushes get a read-only token) would only fail or add snapshots nobody reads.
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    uses: bernardladenthin/actions/.github/workflows/java-maven-dependency-submission.yml@23543c8554ca9de6792a1b8d8aae0bcd001d8508 # v1.0.3
    permissions:
      contents: write
