# Tests for the Python tooling under docs/measurements/.
#
# A separate pipeline rather than a step in publish.yml, because it shares nothing with the Java
# build: no JDK, no Maven cache, no LMDB or OpenCL, and it finishes in well under a second. Bolting
# it onto a job that takes minutes would only make the Java build slower to report.
#
# It also runs on a path filter. register_machine.py is touched a few times a year; running it on
# every push to unrelated Java code would be noise, and a check that is usually irrelevant is a check
# people learn to ignore.
name: Measurement tooling

on:
  push:
    paths:
      - 'docs/measurements/**.py'
      - 'docs/measurements/machines.json'
      - '.github/workflows/measurement-tools.yml'
  pull_request:
    paths:
      - 'docs/measurements/**.py'
      - 'docs/measurements/machines.json'
      - '.github/workflows/measurement-tools.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version matters: register_machine.py is written for a contributor's own machine, so it
      # must keep working on whatever Python a distribution ships, not only on the newest. The matrix
      # runs the oldest Python still receiving security fixes (3.10 since 3.9 reached end of life in
      # October 2025) and the newest stable one -- that is what keeps the script working on both
      # ends rather than assumed. Move the lower bound up when it reaches end of life.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the measurement tooling tests
        run: python -m unittest discover -s docs/measurements -p 'test_*.py' -v

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
