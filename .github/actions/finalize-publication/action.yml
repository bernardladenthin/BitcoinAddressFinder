name: Finalize signed publication
description: Collect, verify and secure the complete signed package before any publication consumer runs.
inputs:
  channel:
    description: Publication channel (snapshot or release).
    required: true
  maven-assets:
    description: Optional directory containing Maven outputs preserved before a rebuild.
    required: false
    default: ''
outputs:
  complete:
    description: True only after the local gate AND the Actions handoff upload succeed.
    value: ${{ steps.ready.outputs.complete }}
runs:
  using: composite
  steps:
    - name: Collect signed artifacts
      id: collect
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        MAVEN_ASSETS: ${{ inputs.maven-assets }}
      run: |
        set -euo pipefail
        case "$CHANNEL" in snapshot|release) ;; *) echo "::error::Invalid publication channel"; exit 1 ;; esac
        args=("signed-${CHANNEL}-assets")
        if [ -n "$MAVEN_ASSETS" ]; then args+=(--maven-assets "$MAVEN_ASSETS"); fi
        python3 .github/collect-release-assets.py "${args[@]}"
    - name: Verify and freeze the complete signed publication
      id: preflight
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
      run: python3 .github/publication.py prepare "signed-${CHANNEL}-assets" publication-package
    - name: Secure the checked publication package
      id: handoff
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: signed-${{ inputs.channel }}-assets
        path: publication-package/
        if-no-files-found: error
    - name: Release the secured package to independent consumers
      id: ready
      shell: bash
      run: echo 'complete=true' >> "$GITHUB_OUTPUT"
